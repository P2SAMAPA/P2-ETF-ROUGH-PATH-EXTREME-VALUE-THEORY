name: Daily Rough-EVT Run

on:
  schedule:
    # 00:30 UTC Monday–Saturday
    - cron: '30 23 * * 1-6'
  workflow_dispatch:

jobs:
  run-rough-evt:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run Rough-EVT engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python trainer.py
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rough-evt-results
          path: |
            rough_evt_*.json
            rough_evt_windows_*.json
